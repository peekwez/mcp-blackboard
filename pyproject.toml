[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-blackboard"
version = "0.2.0"
description = "A mcp server for providing a blackboard interface to the mcp agent"
authors = [
    { name = "Kwesi Apponsah", email = "kwesparry@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "apscheduler>=3.11.0",
    "click>=8.1.8",
    "dotenv>=0.9.9",
    "fastapi>=0.115.13",
    "fsspec[abfs,fuse,gcs,s3,sftp,smb]>=2025.3.2",
    "jinja2>=3.1.6",
    "markitdown[all]>=0.1.1",
    "mcp[cli]>=1.9",
    "openai>=1.76.0",
    "pydantic>=2.11.3",
    "pydantic-settings>=2.9.1",
    "pyyaml>=6.0.2",
    "redis>=5.2.1",
    "tavily-python>=0.7.8",
    "tenacity>=9.1.2",
]

[project.scripts]
ferros = "nexus.cli:cli"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "coverage>=7.8.0",
    "mypy>=1.15.0",
    "pre-commit>=4.2.0",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "pytest-cov>=6.1.1",
    "rich>=14.0.0",
    "ruff>=0.11.7",
]


[tool.ruff]
lint.select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade,
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"examples/**/*.py" = ["F401"]

[tool.mypy]
strict = false
warn_unused_ignores = false
disallow_any_generics = true
no_implicit_reexport = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
explicit_package_bases = true
disallow_untyped_decorators = false
ignore_missing_imports = true
namespace_packages = true
plugins = [
    "pydantic.mypy"
]

[tool.coverage.run]
source = ["tests", "src"]
omit = [
    "tests/*",
    "src/__init__.py",
]

[tool.coverage.report]
show_missing = true
sort = "-Cover"
fail_under = 90
exclude_also = [
    "if TYPE_CHECKING:",
    "@abc.abstractmethod",
    "raise NotImplementedError",
    "logger.debug",
]

[tool.pytest.ini_options]
pythonpath = "src/"
addopts = [
    "--pdb",
    "--tb=short",
    "--disable-warnings",
    "--maxfail=1",
]

testpaths = [
    "tests",
    "src",
]

filterwarnings = [
    "ignore:DeprecatedWarning:RuntimeWarning:UserWarning",
]

asyncio_default_fixture_loop_scope = "function"
