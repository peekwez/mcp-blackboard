services:
  mcp-blackboard:
    image: mcp/blackboard
    container_name: mcp-blackboard
    env_file: .env.docker
    ports:
      - 8000:8000
    volumes:
      - shared-volume:/mnt/shared
    depends_on:
      - mem-blackboard
      - vol-blackboard
    networks:
      - mcp-network

  mem-blackboard:
    image: redis/redis-stack:latest
    container_name: mem-blackboard
    ports:
      - 6380:6379
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10

  vol-blackboard:
    image: busybox
    container_name: vol-blackboard
    command: sh -c "cp -r /mnt/shared/* /mnt/volume && tail -f /dev/null"
    volumes:
      - /private/tmp/genai/cache:/mnt/shared/cache
      - /private/tmp/genai/data:/mnt/shared/data
      - shared-volume:/mnt/volume
    networks:
      - mcp-network

volumes:
  shared-volume:
    driver: local
    external: false

networks:
  mcp-network:
    driver: bridge
