services:
  mcp-blackboard:
    image: mcp/blackboard
    container_name: mcp-blackboard
    env_file: .env.docker
    ports:
      - "8000:8000"
    volumes:
      - /tmp/genai/data:/app/data
      - /tmp/genai/cache:/app/cache
    depends_on:
      - mem-blackboard
    networks:
      - mcp-network

  mem-blackboard:
    image: redis/redis-stack:latest
    container_name: mem-blackboard
    ports:
      - "6380:6379"
    networks:
      - mcp-network

networks:
  mcp-network:
    driver: bridge
